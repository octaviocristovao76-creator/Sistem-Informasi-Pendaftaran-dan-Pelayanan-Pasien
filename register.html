<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SiPasien</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <h2>SiPasien</h2>
            <span>Sehat Bersama, Lebih Mudah</span>
        </div>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="#">Pelayanan</a>
            <a href="#">Informasi</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <!-- REGISTER -->
    <main class="register-page">

        <div class="register-container">

            <h1>Register</h1>

            <p class="register-subtitle">
                Buat akun baru untuk menggunakan layanan SiPasien.
            </p>

            <form>

                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label>NIK</label>
                    <input type="text" placeholder="Masukkan NIK" required>
                </div>

                <div class="form-group">
                    <label>No. Telepon</label>
                    <input type="text" placeholder="Masukkan nomor telepon" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Masukkan email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Masukkan password" required>
                </div>

                <div class="form-group">
                    <label>Konfirmasi Password</label>
                    <input type="password" placeholder="Konfirmasi password" required>
                </div>

                <button type="submit" class="register-button">
                    Daftar
                </button>

            </form>

            <p class="login-text">
                Sudah punya akun?
                <a href="login.html">Login</a>
            </p>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 SiPasien - Sistem Informasi Pendaftaran dan Pelayanan Pasien</p>
    </footer>

</body>
</html>
